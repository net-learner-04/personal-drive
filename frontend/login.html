<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arkeon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%2306b6d4'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><path d='M10 23L16 9l6 14M12.5 18.5h7' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="bg-canvas"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

  <nav class="topbar-global">
    <a href="/" class="nav-logo">
      <svg class="nav-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="url(#ng)"/><defs><linearGradient id="ng" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><path d="M10 23L16 9l6 14M12.5 18.5h7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Arkeon
    </a>
    <div class="nav-right">
      <button class="theme-toggle"></button>
      <a href="register.html" class="btn-nav-ghost">Create account</a>
    </div>
  </nav>

  <div class="auth-page page">
    <div class="glass auth-card">
      <a href="/" class="auth-logo">
        <svg class="auth-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="url(#ag)"/><defs><linearGradient id="ag" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><path d="M10 23L16 9l6 14M12.5 18.5h7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Arkeon</span>
      </a>

      <div id="loginSection">
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-sub">Sign in to your private cloud</p>
        <div id="alert" class="alert" style="margin-bottom:1rem;"></div>
        <div class="form-stack">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
          </div>
          <div style="text-align:right;margin-top:-0.4rem;">
            <a href="reset-password.html" style="font-size:0.8rem;color:var(--text3);">Forgot password?</a>
          </div>
          <button class="btn btn-primary" id="loginBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
          </button>
        </div>
        <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
      </div>

      <div id="dormantSection" style="display:none;text-align:center;">
        <div style="width:60px;height:60px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.6rem;">😴</div>
        <h1 class="auth-heading" style="font-size:1.35rem;">Account Dormant</h1>
        <p class="auth-sub">Your account has been inactive for 30+ days and placed in dormant status.</p>
        <div id="dormantAlert" class="alert" style="margin-bottom:1rem;text-align:left;"></div>
        <div id="dormantStep1">
          <div class="form-stack">
            <div class="form-group" style="text-align:left;">
              <label>Email address</label>
              <input type="email" id="dormantEmail" placeholder="your@email.com"/>
            </div>
            <button class="btn btn-primary" id="dormantSendBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send Unlock Code
            </button>
          </div>
        </div>
        <div id="dormantStep2" style="display:none;">
          <div class="form-stack">
            <div class="form-group" style="text-align:left;">
              <label>Verification code</label>
              <input type="text" id="dormantCode" placeholder="000000" maxlength="6" style="text-align:center;letter-spacing:0.3em;font-size:1.3rem;font-weight:800;"/>
            </div>
            <button class="btn btn-primary" id="dormantVerifyBtn">Reactivate Account</button>
          </div>
        </div>
        <div style="margin-top:1.1rem;">
          <button onclick="showLoginSection()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.82rem;">← Back to sign in</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (auth.getToken()) window.location.href = "dashboard.html";

    const alertEl = document.getElementById("alert");
    const loginBtn = document.getElementById("loginBtn");

    function showLoginSection() {
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("dormantSection").style.display = "none";
    }
    function showDormantSection() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("dormantSection").style.display = "block";
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) { showAlert(alertEl, "Please fill in all fields."); return; }
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Signing in...`;
      hideAlert(alertEl);
      const res = await fetch(`${API}/api/user/login`, {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams({username: email, password})
      });
      const data = await res.json();
      if (res.ok) {
        auth.setToken(data.access_token);
        const meRes = await fetch(`${API}/api/user/me`, { headers: {Authorization: `Bearer ${data.access_token}`} });
        const me = await meRes.json();
        auth.setUser({name: me.name, is_admin: me.is_admin, id: me.id, profile_image: me.profile_image});
        window.location.href = "dashboard.html";
      } else if (res.status === 403 && data.detail === "dormant") {
        showDormantSection();
        document.getElementById("dormantEmail").value = email;
      } else {
        showAlert(alertEl, data.detail || "Incorrect email or password.");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In`;
      }
    }

    loginBtn.addEventListener("click", login);
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.getElementById("loginSection").style.display !== "none") login();
    });

    let dormantEmail = "";
    document.getElementById("dormantSendBtn").addEventListener("click", async () => {
      const email = document.getElementById("dormantEmail").value.trim();
      const a = document.getElementById("dormantAlert");
      if (!email) { showAlert(a, "Please enter your email."); return; }
      const btn = document.getElementById("dormantSendBtn");
      btn.textContent = "Sending..."; btn.disabled = true; hideAlert(a);
      const res = await fetch(`${API}/api/user/dormant/unlock-request?email=${encodeURIComponent(email)}`, {method:"POST"});
      const d = await res.json();
      if (res.ok) {
        dormantEmail = email;
        document.getElementById("dormantStep1").style.display = "none";
        document.getElementById("dormantStep2").style.display = "block";
        showAlert(a, "Unlock code sent! Check your inbox.", "success");
      } else {
        showAlert(a, d.detail || "Failed to send unlock code.");
        btn.textContent = "Send Unlock Code"; btn.disabled = false;
      }
    });

    document.getElementById("dormantVerifyBtn").addEventListener("click", async () => {
      const code = document.getElementById("dormantCode").value.trim();
      const a = document.getElementById("dormantAlert");
      if (!code) { showAlert(a, "Please enter the code."); return; }
      const btn = document.getElementById("dormantVerifyBtn");
      btn.textContent = "Verifying..."; btn.disabled = true; hideAlert(a);
      const res = await fetch(`${API}/api/user/dormant/unlock-confirm?${new URLSearchParams({email:dormantEmail,code})}`, {method:"POST"});
      const d = await res.json();
      if (res.ok) {
        showAlert(a, "Account reactivated! You can now sign in.", "success");
        setTimeout(() => {
          showLoginSection();
          document.getElementById("dormantStep1").style.display = "block";
          document.getElementById("dormantStep2").style.display = "none";
        }, 2000);
      } else {
        showAlert(a, d.detail || "Invalid or expired code.");
        btn.textContent = "Reactivate Account"; btn.disabled = false;
      }
    });
  </script>
  <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
</body>
</html>
