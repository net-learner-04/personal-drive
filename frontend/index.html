<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arkeon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%2306b6d4'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><path d='M10 23L16 9l6 14M12.5 18.5h7' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .hero-logo{display:flex;align-items:center;gap:0.75rem;margin-bottom:3rem;animation:card-in 0.5s cubic-bezier(0.34,1.4,0.64,1);}
    .hero-wordmark{font-size:1.5rem;font-weight:900;letter-spacing:-0.5px;}
    .hero-tagline{font-size:0.8rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:1.5rem;animation:card-in 0.5s 0.1s cubic-bezier(0.34,1.4,0.64,1) both;}
    .hero-title{font-size:clamp(2.8rem,8vw,5.5rem);font-weight:900;letter-spacing:-3px;line-height:0.95;margin-bottom:1.25rem;animation:card-in 0.5s 0.15s cubic-bezier(0.34,1.4,0.64,1) both;}
    .hero-title .hl{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .hero-sub{font-size:1rem;color:var(--text2);max-width:360px;line-height:1.6;margin-bottom:2.75rem;animation:card-in 0.5s 0.2s cubic-bezier(0.34,1.4,0.64,1) both;}
    .hero-btns{display:flex;gap:0.85rem;flex-wrap:wrap;justify-content:center;animation:card-in 0.5s 0.25s cubic-bezier(0.34,1.4,0.64,1) both;}
    .btn-hero-primary{display:inline-flex;align-items:center;gap:0.5rem;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:99px;color:#fff;cursor:pointer;font-family:inherit;font-size:0.95rem;font-weight:700;padding:0.85rem 2rem;text-decoration:none;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);box-shadow:0 4px 20px var(--accent-glow);letter-spacing:0.01em;}
    .btn-hero-primary:hover{transform:translateY(-3px);box-shadow:0 8px 32px var(--accent-glow);color:#fff;}
    .btn-hero-ghost{display:inline-flex;align-items:center;gap:0.5rem;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:99px;color:var(--text);cursor:pointer;font-family:inherit;font-size:0.95rem;font-weight:600;padding:0.85rem 2rem;text-decoration:none;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);}
    .btn-hero-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;}
    .top-logo{display:flex;align-items:center;gap:0.55rem;font-size:0.95rem;font-weight:900;letter-spacing:-0.3px;color:var(--text);text-decoration:none;}
    .top-right{display:flex;align-items:center;gap:0.5rem;}
    @keyframes card-in{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
    .glow-line{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);margin:2rem auto;animation:card-in 0.5s 0.3s ease both;opacity:0.5;}
  </style>
</head>
<body>
  <div class="bg-canvas"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

  <div class="topbar">
    <a href="/" class="top-logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="url(#tg)"/><defs><linearGradient id="tg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><path d="M10 23L16 9l6 14M12.5 18.5h7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Arkeon
    </a>
    <div class="top-right">
      <button class="theme-toggle"></button>
      <a href="login.html" class="btn-nav-ghost">Sign In</a>
    </div>
  </div>

  <div class="hero page">
    <div class="hero-logo">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="url(#hg)"/><defs><linearGradient id="hg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><path d="M10 23L16 9l6 14M12.5 18.5h7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="hero-wordmark">Arkeon</span>
    </div>
    <p class="hero-tagline">Private · Secure · Self-hosted</p>
    <h1 class="hero-title">Your files.<br/><span class="hl">Your server.</span></h1>
    <p class="hero-sub">A private cloud storage — upload, manage, and access your files securely from anywhere.</p>
    <div class="hero-btns">
      <a href="login.html" class="btn-hero-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </a>
      <a href="register.html" class="btn-hero-ghost">
        Create account
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
    <div class="glow-line"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (auth.getToken()) window.location.href = "dashboard.html";
  </script>
</body>
</html>
